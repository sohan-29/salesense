name: Docker Build (manual)

# Manual-only workflow: builds the backend and frontend container images to
# verify the Dockerfiles compile and produce runnable images. Does NOT push
# to any registry — run it on demand from the Actions tab to validate the
# containerization before a real release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (defaults to commit SHA)'
        required: false
        default: ''

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: shopsense-backend:${{ inputs.tag || github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image starts
        run: |
          docker run --rm -d --name backend-smoke \
            -e NODE_ENV=production \
            -e JWT_SECRET=smoke \
            -e MONGODB_URI=mongodb://placeholder:27017/shopsense \
            -e PORT=5000 \
            -p 5000:5000 \
            shopsense-backend:${{ inputs.tag || github.sha }} || true
          # The container will exit without a reachable Mongo, which is fine —
          # we only want to confirm the image boots past install/entrypoint.
          sleep 3
          docker logs backend-smoke 2>/dev/null || true
          docker stop backend-smoke 2>/dev/null || true

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: shopsense-frontend:${{ inputs.tag || github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test nginx serves the SPA
        run: |
          docker run --rm -d --name frontend-smoke -p 8080:80 \
            shopsense-frontend:${{ inputs.tag || github.sha }}
          sleep 2
          curl -sf http://localhost:8080/ | grep -q "<div id=\"root\">" \
            && echo "SPA shell served OK" \
            || { echo "SPA shell missing"; exit 1; }
          docker stop frontend-smoke
